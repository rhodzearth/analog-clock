<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analog Clock</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #4285f4, #9b59b6);
      font-family: Arial, sans-serif;
    }

    .clock {
      width: 300px;
      height: 300px;
      border: 10px solid white;
      border-radius: 50%;
      position: relative;
      background: #fff;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
    }

    .number {
      position: absolute;
      width: 100%;
      height: 100%;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #333;
    }

    .number1  { transform: rotate(30deg); }
    .number2  { transform: rotate(60deg); }
    .number3  { transform: rotate(90deg); }
    .number4  { transform: rotate(120deg); }
    .number5  { transform: rotate(150deg); }
    .number6  { transform: rotate(180deg); }
    .number7  { transform: rotate(210deg); }
    .number8  { transform: rotate(240deg); }
    .number9  { transform: rotate(270deg); }
    .number10 { transform: rotate(300deg); }
    .number11 { transform: rotate(330deg); }

    .number span {
      display: inline-block;
      transform: rotate(calc(-1 * var(--rotate, 0deg)));
      margin-top: 10px;
    }

    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom;
      transform: translateX(-50%) rotate(0deg);
      border-radius: 10px;
    }

    .hour {
      width: 8px;
      height: 70px;
      background: #333;
    }

    .minute {
      width: 5px;
      height: 100px;
      background: #555;
    }

    .second {
      width: 2px;
      height: 120px;
      background: red;
    }

    .center {
      position: absolute;
      width: 16px;
      height: 16px;
      background: #333;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    @media (max-width: 360px), (max-height: 360px) {
      .clock {
        transform: scale(0.85);
      }
    }
  </style>
</head>
<body>
  <main class="clock" aria-label="Analog clock showing your device's local time">
    <div class="number number1" style="--rotate:30deg;"><span>1</span></div>
    <div class="number number2" style="--rotate:60deg;"><span>2</span></div>
    <div class="number number3" style="--rotate:90deg;"><span>3</span></div>
    <div class="number number4" style="--rotate:120deg;"><span>4</span></div>
    <div class="number number5" style="--rotate:150deg;"><span>5</span></div>
    <div class="number number6" style="--rotate:180deg;"><span>6</span></div>
    <div class="number number7" style="--rotate:210deg;"><span>7</span></div>
    <div class="number number8" style="--rotate:240deg;"><span>8</span></div>
    <div class="number number9" style="--rotate:270deg;"><span>9</span></div>
    <div class="number number10" style="--rotate:300deg;"><span>10</span></div>
    <div class="number number11" style="--rotate:330deg;"><span>11</span></div>
    <div class="number number12"><span>12</span></div>

    <div class="hand hour" id="hour"></div>
    <div class="hand minute" id="minute"></div>
    <div class="hand second" id="second"></div>
    <div class="center"></div>
  </main>

  <script>
    function updateClock() {
      const now = new Date();

      const seconds = now.getSeconds();
      const minutes = now.getMinutes();
      const hours = now.getHours();

      const secondDeg = seconds * 6;
      const minuteDeg = minutes * 6 + seconds * 0.1;
      const hourDeg = (hours % 12) * 30 + minutes * 0.5;

      document.getElementById('second').style.transform =
        `translateX(-50%) rotate(${secondDeg}deg)`;

      document.getElementById('minute').style.transform =
        `translateX(-50%) rotate(${minuteDeg}deg)`;

      document.getElementById('hour').style.transform =
        `translateX(-50%) rotate(${hourDeg}deg)`;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
